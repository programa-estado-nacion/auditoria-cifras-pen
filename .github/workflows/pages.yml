# Publica la interfaz y el manifiesto de producción en GitHub Pages.
# Cada push a main actualiza el sitio; los usuarios reciben la versión nueva
# al reabrir Word, sin reinstalar el complemento.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar sitio y manifiesto
        run: |
          mkdir public
          cp -R src/. public/
          cp public/taskpane.html public/index.html
          sed 's|__BASE_URL__|https://programa-estado-nacion.github.io/auditoria-cifras-pen|g' \
            deploy/manifest.prod.xml > public/manifest.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: despliegue
        uses: actions/deploy-pages@v4
